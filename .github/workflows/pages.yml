name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir _site
          cp -r index.html app.js styles.css sw.js manifest.webmanifest icons _site/
          # Nouveau cache du service worker à chaque déploiement
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'habits-${GITHUB_SHA::7}'/" _site/sw.js
          grep "const VERSION" _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
